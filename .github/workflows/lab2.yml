name: IP Filter Release Build

on:
    push:
        branches:
            - main

permissions:
    contents: write

jobs:
    build:
        name: Build on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                include:
                    - os: macos-latest
                      package-extention: dmg
                    - os: ubuntu-latest
                      package-extention: deb
        
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7
            
            - name: Configure CMake
              run: |
                cmake -S . -B build \
                -DPATCH_VERSION=${{ github.run_number }} \
                -DCMAKE_RELEASE_TYPE=Release

            - name: Build Release
              run: cmake --build build --config Release

            - name: Build Package
              run: cmake --build build --target package --config Release

            - name: Upload Package Artifact
              uses: actions/upload-artifact@v7
              with:
                name: ip-filter-${{ runner.os }}
                path: build/*.${{ matrix.package-extention }}
                if-no-files-found: error

    release:
        name: Create GitHub Release
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Download Artifact
              uses: actions/download-artifact@v7
              with:
                path: artifacts
            
            - name: Create Release
              uses: softprops/action-gh-release@v3
              with:
                token: ${{ secrets.GITHUB_TOKEN }}
                tag_name: v1.0.${{ github.run_number }}
                name: Release v1.0.${{ github.run_number }}
                generate_release_notes: true
                files:
                    artifacts/ip-filter-macOS/*.dmg
                    artifacts/ip-filter-Linux/*.deb
    